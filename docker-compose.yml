services:
  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NOESIS_NEO4J_PASSWORD:-noesis123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NOESIS_NEO4J_PASSWORD:-noesis123} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    ports:
      - "${NOESIS_WEB_PORT:-8000}:8000"
    environment:
      # LLM
      NOESIS_LLM_PROVIDER: ${NOESIS_LLM_PROVIDER:-deepseek}
      NOESIS_LLM_MODEL: ${NOESIS_LLM_MODEL:-deepseek-v4-flash}
      NOESIS_LLM_API_KEY: ${NOESIS_LLM_API_KEY}
      NOESIS_LLM_BASE_URL: ${NOESIS_LLM_BASE_URL:-https://api.deepseek.com}
      # Neo4j — uses Docker service name
      NOESIS_NEO4J_URI: bolt://neo4j:7687
      NOESIS_NEO4J_USER: ${NOESIS_NEO4J_USER:-neo4j}
      NOESIS_NEO4J_PASSWORD: ${NOESIS_NEO4J_PASSWORD:-noesis123}
      # Web server — bind all interfaces inside container
      NOESIS_WEB_HOST: "0.0.0.0"
      NOESIS_WEB_PORT: "8000"
      # Platform adapters
      NOESIS_PLATFORM_WEB_ENABLED: "true"
      # WeChat — direct iLink API (QR login, self-contained)
      NOESIS_PLATFORM_WECHAT_ENABLED: ${NOESIS_PLATFORM_WECHAT_ENABLED:-false}
      # QQ — Tencent official botpy SDK
      NOESIS_PLATFORM_QQ_ENABLED: ${NOESIS_PLATFORM_QQ_ENABLED:-false}
      NOESIS_PLATFORM_QQ_APP_ID: ${NOESIS_PLATFORM_QQ_APP_ID:-}
      NOESIS_PLATFORM_QQ_APP_SECRET: ${NOESIS_PLATFORM_QQ_APP_SECRET:-}
      NOESIS_PLATFORM_QQ_ALLOWED_USERS: ${NOESIS_PLATFORM_QQ_ALLOWED_USERS:-}
      # Telegram — python-telegram-bot
      NOESIS_PLATFORM_TELEGRAM_ENABLED: ${NOESIS_PLATFORM_TELEGRAM_ENABLED:-false}
      NOESIS_PLATFORM_TELEGRAM_TOKEN: ${NOESIS_PLATFORM_TELEGRAM_TOKEN:-}
      NOESIS_PLATFORM_TELEGRAM_ALLOWED_USERS: ${NOESIS_PLATFORM_TELEGRAM_ALLOWED_USERS:-}
      # Discord — discord.py
      NOESIS_PLATFORM_DISCORD_ENABLED: ${NOESIS_PLATFORM_DISCORD_ENABLED:-false}
      NOESIS_PLATFORM_DISCORD_TOKEN: ${NOESIS_PLATFORM_DISCORD_TOKEN:-}
      NOESIS_PLATFORM_DISCORD_CHANNELS: ${NOESIS_PLATFORM_DISCORD_CHANNELS:-}
      # Feishu/Lark — lark-oapi SDK
      NOESIS_PLATFORM_FEISHU_ENABLED: ${NOESIS_PLATFORM_FEISHU_ENABLED:-false}
      NOESIS_PLATFORM_FEISHU_APP_ID: ${NOESIS_PLATFORM_FEISHU_APP_ID:-}
      NOESIS_PLATFORM_FEISHU_APP_SECRET: ${NOESIS_PLATFORM_FEISHU_APP_SECRET:-}
      # Context
      NOESIS_CONTEXT_BUDGET_TOKENS: ${NOESIS_CONTEXT_BUDGET_TOKENS:-30000}
      NOESIS_SUBCONSCIOUS_IDLE_SECONDS: ${NOESIS_SUBCONSCIOUS_IDLE_SECONDS:-300}
      NOESIS_SUBCONSCIOUS_TIMER_SECONDS: ${NOESIS_SUBCONSCIOUS_TIMER_SECONDS:-1800}
    volumes:
      - workspace_data:/app/workspace
      - skills_data:/app/skills
      - archives_data:/app/archives
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./webui
      args:
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-localhost}
        NEXT_PUBLIC_API_PORT: ${NOESIS_WEB_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  workspace_data:
  skills_data:
  archives_data:
