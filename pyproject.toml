[project]
name = "infocap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "playwright>=1.44.0",
    "shortuuid>=1.0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
